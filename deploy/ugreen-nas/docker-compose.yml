# JiuwenSwarm + DevCo swarm on a UGREEN NAS (UGOS Pro Docker -> Project).
#
# Security model: JiuwenSwarm publishes NO ports on your LAN. It shares the network
# namespace of the Tailscale container, listens on 127.0.0.1 only, and Tailscale
# "serve" exposes the web UI over HTTPS to devices on YOUR tailnet only.
# See README.md for the step-by-step setup.

services:
  tailscale:
    image: tailscale/tailscale:v1.104.7
    container_name: devco-tailscale
    hostname: ${TS_HOSTNAME:-devco}
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:?set TS_AUTHKEY in .env}
      TS_HOSTNAME: ${TS_HOSTNAME:-devco}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_USERSPACE: "false"
    volumes:
      - ${DEVCO_DATA_DIR:?set DEVCO_DATA_DIR in .env}/tailscale:/var/lib/tailscale
      - ./tailscale-serve.json:/config/serve.json:ro
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW
    restart: unless-stopped

  jiuwenswarm:
    build:
      context: ../..
      dockerfile: deploy/ugreen-nas/Dockerfile
    image: devco-jiuwenswarm:local
    container_name: devco-jiuwenswarm
    network_mode: service:tailscale     # no ports: unreachable from the LAN
    depends_on:
      - tailscale
    environment:
      DEVCO_PUBLIC_HOST: ${TS_HOSTNAME:-devco}.${TS_TAILNET:?set TS_TAILNET in .env}
      TZ: ${TZ:-UTC}
    volumes:
      - ${DEVCO_DATA_DIR}/jiuwenswarm:/home/app/.jiuwenswarm
      - ${DEVCO_PROJECTS_DIR:?set DEVCO_PROJECTS_DIR in .env}:/projects
    # Optional: cap resources so a runaway build cannot starve the NAS.
    # mem_limit: 6g
    # cpus: 3
    restart: unless-stopped
